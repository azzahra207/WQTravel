<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pendaftaran Umroh - Waridat Qolbi Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    /* copy semua :root dan style dari index.html */
    /* atau buat file terpisah styles.css nanti */
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark-2">
  <!-- sama seperti index -->
</nav>

<main class="pt-5 mt-4 container py-4">

  <h2 class="tajawal text-center mb-4" data-aos="fade-up">Pendaftaran Umroh 2025-2026</h2>

  <div class="card" data-aos="fade-up" data-aos-delay="100">
    <div class="card-header text-center">
      <h5 class="mb-0">Form Pendaftaran</h5>
    </div>
    <div class="card-body">
      <form id="formDaftar">
        <div class="mb-3">
          <label class="form-label">Nama Lengkap sesuai KTP</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Nomor HP (WhatsApp)</label>
          <input type="tel" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Pilihan Paket</label>
          <select class="form-select">
            <option>Paket Reguler 12 Hari – Rp 28.500.000</option>
            <option>Paket VIP 9 Hari – Rp 38.000.000</option>
            <option>Paket Hemat 15 Hari – Rp 25.000.000</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Tanggal Keberangkatan yang Diinginkan</label>
          <input type="month" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">KIRIM PENDAFTARAN</button>
      </form>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init();
  
  // Contoh submit sederhana + SweetAlert
  document.getElementById('formDaftar')?.addEventListener('submit', e => {
    e.preventDefault();
    Swal.fire({
      title: 'Alhamdulillah!',
      text: 'Data pendaftaran telah kami terima. Tim akan menghubungi Anda segera.',
      icon: 'success',
      confirmButtonColor: '#198754'
    });
  });
</script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
